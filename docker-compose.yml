services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restaurant-intro
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # 若 .env 不存在，OPENROUTER_API_KEY 預設為空字串
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    volumes:
      # 掛載靜態資源（圖片、3D 模型）以避免映像過大，可視需求移除
      - ./Backend/static:/app/Backend/static:ro
      # 菜單 JSON 可熱更新，不需重建映像
      - ./Backend/menu.json:/app/Backend/menu.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
